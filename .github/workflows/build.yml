name: Build

# Every platform the agent ships to - Linux, macOS, Windows, each on amd64 and
# arm64 - built the same way: test, then the platform's own
# gui/<platform>/build.sh, the script a developer runs, so CI builds what a
# person would. One cell per platform and architecture, on a runner of that
# kind (the matrix is encedo-wg-hsm's), because the window links a GUI toolkit
# through cgo and cgo builds for the machine it runs on - except macOS, whose
# clang carries both: the amd64 bundle is built on the arm64 runner and tested
# in the arm64 cell. The agent (Rust) is built in the same cell, so both halves
# carry one stamp (<version>+<commit>) and accept each other.
#
# Each cell leaves, under the artifact hem-ssh-agent-<os>-<arch>:
#
#   hem-ssh-agent-<version>-<os>-<arch>.zip|.tar.gz       agent + window + installer
#   hem-ssh-agent-cli-<version>-<os>-<arch>.zip|.tar.gz   the command line alone
#
# Not run on its own: ci.yml calls it on every push.
on:
  workflow_call:
    inputs:
      package:
        description: Also build the bundles and upload them.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # native: the cell runs what it builds, so it also tests it.
        include:
          - { os: linux,   arch: amd64, runner: ubuntu-24.04,     native: true }
          # Free arm64 Linux runners for public repositories.
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm, native: true }
          - { os: macos,   arch: amd64, runner: macos-latest,     native: false, rust-target: x86_64-apple-darwin }
          - { os: macos,   arch: arm64, runner: macos-latest,     native: true }
          - { os: windows, arch: amd64, runner: windows-latest,   native: true }
          - { os: windows, arch: arm64, runner: windows-11-arm,   native: true }

    env:
      # Read by the build.sh scripts: macOS builds this architecture, the
      # others check that the runner is of it.
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # hem-sdk-rust and gui/hem-sdk-go are submodules (public).
          submodules: recursive
          # The whole history: the bundle scripts stamp the build with the
          # commit.
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.rust-target }}

      # Per cell: the two macOS cells share a runner kind and a job name.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum

      # Fyne is cgo, and GLFW compiles an X11 and a Wayland backend into the
      # same binary: headers for both (list from encedo-wg-hsm's build).
      - name: Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libgl1-mesa-dev xorg-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      # From encedo-wg-hsm: the Windows ARM runner image has only x86 and x64
      # MinGW, so the `gcc` on PATH is an emulated x86-64 compiler, which cgo's
      # arm64 code does not assemble. A native aarch64 one from llvm-mingw (one
      # pinned archive with a checksum), as CC for the window's cgo. Unpacked
      # beside the checkout, out of every upload path.
      - name: Windows ARM64 build dependencies
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -eu
          ver=20260908
          sum=7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56
          zip=llvm-mingw-$ver-ucrt-aarch64.zip
          work=../_toolchain
          rm -rf "$work"; mkdir -p "$work"
          curl -sSLf -o "$work/$zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$zip"
          echo "$sum  $work/$zip" | sha256sum -c -
          powershell -NoProfile -Command "Expand-Archive -Force '$work/$zip' '$work/x'"
          # pwd -W: D:/a/... - a path the Go toolchain, a Windows program, reads.
          bin="$(cd "$work/x/llvm-mingw-$ver-ucrt-aarch64/bin" && pwd -W)"
          "$bin/aarch64-w64-mingw32-gcc.exe" --version | head -1
          {
            echo "CC=$bin/aarch64-w64-mingw32-gcc.exe"
            echo "CXX=$bin/aarch64-w64-mingw32-g++.exe"
          } >> "$GITHUB_ENV"

      # Once, on Linux: a Windows checkout may carry CRLF, which gofmt reports.
      # Only gui/*.go - gui/hem-sdk-go is another repository.
      - name: gofmt (window)
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        working-directory: gui
        run: |
          unformatted="$(gofmt -l *.go)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Clippy
        if: matrix.native
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      # Offline: the live tests skip without HEM_URL / HEM_PASSWORD.
      - name: Test (agent)
        if: matrix.native
        shell: bash
        run: cargo test --locked

      - name: Vet and test (window)
        if: matrix.native
        working-directory: gui
        shell: bash
        run: |
          go vet -tags migrated_fynedo .
          go test -tags migrated_fynedo .

      - name: Bundles
        if: inputs.package
        shell: bash
        run: |
          set -eu
          case "${{ matrix.os }}" in
            linux)   sh gui/linux/build.sh ;;
            macos)   sh gui/macos/build.sh ;;
            windows) bash gui/windows/build.sh ;;
          esac
          ls -l target/dist

      - name: Upload
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: hem-ssh-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
