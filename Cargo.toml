[package]
name = "hem-ssh-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "SSH agent whose keys live in an Encedo HEM"
license = "MIT"
repository = "https://github.com/encedo/hem-ssh-agent"
publish = false

[dependencies]
hem-sdk = { path = "hem-sdk-rust" }
# Agent protocol + transports (unix socket, Windows named pipe).
ssh-agent-lib = "0.6"
# The version ssh-agent-lib uses: its KeyData / Signature types cross the API.
ssh-key = "0.6"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
zeroize = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The named pipe's access list (src/listen.rs); the version tokio already uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The live test checks the agent's signatures independently, as an SSH server would.
ed25519-dalek = "2"

# PBKDF2 (600 000 iterations, in hem-sdk) is seconds per call unoptimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
